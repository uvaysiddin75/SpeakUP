services:
  postgres:
    image: postgres:16-alpine
    container_name: speakup-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: speakup
      POSTGRES_PASSWORD: speakup
      POSTGRES_DB: speakup
    volumes:
      - speakup_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakup -d speakup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  speakup_pg_data:
